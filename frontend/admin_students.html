<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Manage Students</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body onload="loadStudents()">

    <div class="navbar">
        <h1>Admin Panel</h1>
        <div class="nav-links">
            <a href="dashboard.html">Dashboard</a>
            <a href="admin_students.html">Students</a>
        </div>
        <button onclick="logout()">Logout</button>
    </div>

    <div class="container">

        <h2>Manage Students</h2>

        <!-- ADD STUDENT FORM -->
        <div class="card">
            <h3>Add New Student</h3>

            <input id="student-name" type="text" placeholder="Student Name">
            <input id="student-email" type="email" placeholder="Student Email">
            <input id="student-class" type="number" placeholder="Class ID">

            <button onclick="addStudent()">Add Student</button>
        </div>

        <!-- STUDENTS TABLE -->
        <div class="card">
            <h3>All Students</h3>

            <table id="students-table">
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Class</th>
                    <th>Actions</th>
                </tr>
            </table>
        </div>

    </div>

<script>
function loadStudents() {
    const user = JSON.parse(localStorage.getItem("user"));

    if (!user || user.role !== "admin") {
        window.location.href = "unauthorized.html";
        return;
    }

    fetch("http://100.29.10.131:5000/students", {
        method: "GET"
    })
    .then(res => res.json())
    .then(data => {
        const table = document.getElementById("students-table");

        data.forEach(student => {
            const tr = document.createElement("tr");

            tr.innerHTML = `
                <td>${student.id}</td>
                <td>${student.name}</td>
                <td>${student.email}</td>
                <td>${student.class_id}</td>
                <td>
                    <button onclick="deleteStudent(${student.id})">Delete</button>
                </td>
            `;

            table.appendChild(tr);
        });
    });
}

function addStudent() {
    const name = document.getElementById("student-name").value;
    const email = document.getElementById("student-email").value;
    const class_id = document.getElementById("student-class").value;

    fetch("http://100.29.10.131:5000/students", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            name,
            email,
            class_id
        })
    })
    .then(res => res.json())
    .then(data => {
        alert(data.message);
        location.reload();
    });
}

function deleteStudent(id) {
    fetch(`http://100.29.10.131:5000/students/${id}`, {
        method: "DELETE"
    })
    .then(res => res.json())
    .then(data => {
        alert(data.message);
        location.reload();
    });
}

function logout() {
    localStorage.removeItem("user");
    window.location.href = "login.html";
}
</script>

</body>
</html>
